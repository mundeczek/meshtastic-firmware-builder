name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., xiaowa-esp32s3)"
        required: true
        type: string
        default: "xiaowa-esp32s3"
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Modify MQTT.cpp line (optional)
        if: inputs.modify_mqtt_line == true
        working-directory: firmware
        run: |
          sed -i 's#bool dontUplink = !mp_decoded.decoded.has_bitfield || !(mp_decoded.decoded.bitfield & BITFIELD_OK_TO_MQTT_MASK);#bool dontUplink = false;#' src/mqtt/MQTT.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Pre-install PlatformIO Packages
        working-directory: firmware
        run: |
          # Wymuszamy instalację i rozpakowanie wszystkich narzędzi dla danego wariantu
          pio pkg install -e ${{ inputs.variant }}

      - name: Deep Search & Patch SCons (Fix Fortran Bug)
        run: |
          python3 -c "
          import os, urllib.request

          fortran_common_url = 'https://raw.githubusercontent.com/SCons/scons/4.7.0/SCons/Tool/FortranCommon.py'
          fortran_scanner_url = 'https://raw.githubusercontent.com/SCons/scons/4.7.0/SCons/Scanner/Fortran.py'

          try:
              print('Downloading original SCons Fortran files...')
              fortran_common_code = urllib.request.urlopen(fortran_common_url).read()
              fortran_scanner_code = urllib.request.urlopen(fortran_scanner_url).read()
          except Exception as e:
              print('Failed to download from GitHub, using dummies:', e)
              fortran_common_code = b'def DialectDirs(*args,**kwargs): return []\ndef FortranEmitter(*args,**kwargs): return args[0] if args else None\ndef ShFortranEmitter(*args,**kwargs): return args[0] if args else None'
              fortran_scanner_code = b'def FortranScanType1(*args,**kwargs): return None'

          print('Scanning directory tree for SCons installations...')
          patched_count = 0
          for root, dirs, files in os.walk('/home/runner'):
              if 'SCons' in dirs:
                  scons_path = os.path.join(root, 'SCons')
                  tool_dir = os.path.join(scons_path, 'Tool')
                  scanner_dir = os.path.join(scons_path, 'Scanner')
                  
                  if os.path.exists(tool_dir):
                      target_common = os.path.join(tool_dir, 'FortranCommon.py')
                      print(f'-> Patching: {target_common}')
                      with open(target_common, 'wb') as f:
                          f.write(fortran_common_code)
                      patched_count += 1
                      
                  if os.path.exists(scanner_dir):
                      target_scanner = os.path.join(scanner_dir, 'Fortran.py')
                      print(f'-> Patching: {target_scanner}')
                      with open(target_scanner, 'wb') as f:
                          f.write(fortran_scanner_code)
                      patched_count += 1

          print(f'Successfully patched {patched_count} Fortran files across all SCons environments!')
          "

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean

      - name: Create firmware archive
        run: |
          cd firmware/.pio/build/${{ inputs.variant }}
          tar -cJf ${{ env.FIRMWARE_ARCHIVE }} --ignore-failed-read *.bin *.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_ARCHIVE }}
          path: firmware/.pio/build/${{ inputs.variant }}/${{ env.FIRMWARE_ARCHIVE }}
          if-no-files-found: error
