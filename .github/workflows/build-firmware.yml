name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., xiaowa-esp32s3)"
        required: true
        type: string
        default: "xiaowa-esp32s3"
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Attempt Build (Allowed to fail)
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean || echo "BUILD FAILED AS EXPECTED - RUNNING DIAGNOSTICS"

      - name: DIAGNOSTIC - Find all SCons traces
        if: always()
        run: |
          echo "================================================================"
          echo ">>> 1. Szukam WSZYSTKICH plików o nazwie FortranCommon.py w systemie:"
          echo "================================================================"
          sudo find / -name "FortranCommon.py" 2>/dev/null || echo "NIE ZNALEZIONO ŻADNEGO pliku FortranCommon.py!"

          echo ""
          echo "================================================================"
          echo ">>> 2. Szukam WSZYSTKICH katalogów zawierających 'scons' (bez rozróżniania wielkości liter):"
          echo "================================================================"
          sudo find / -iname "*scons*" -type d 2>/dev/null

          echo ""
          echo "================================================================"
          echo ">>> 3. Szukam WSZYSTKICH plików SCons.py oraz scons.py (executables):"
          echo "================================================================"
          sudo find / -iname "scons*.py" 2>/dev/null
          sudo find / -iname "scons" -type f 2>/dev/null

          echo ""
          echo "================================================================"
          echo ">>> 4. Zawartość głównego katalogu penv (jeśli istnieje):"
          echo "================================================================"
          ls -la /home/runner/.platformio/penv/ 2>/dev/null || echo "Brak penv"
          echo "--- Podfoldery penv (lib): ---"
          find /home/runner/.platformio/penv -type d -iname "*scons*" 2>/dev/null
