name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., xiaowa-esp32s3)"
        required: true
        type: string
        default: "xiaowa-esp32s3"
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Modify MQTT.cpp line (optional)
        if: inputs.modify_mqtt_line == true
        working-directory: firmware
        run: |
          sed -i 's#bool dontUplink = !mp_decoded.decoded.has_bitfield || !(mp_decoded.decoded.bitfield & BITFIELD_OK_TO_MQTT_MASK);#bool dontUplink = false;#' src/mqtt/MQTT.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Force Download Platform and Tools
        working-directory: firmware
        run: |
          # Ta komenda pobiera platformę pioarduino i narzędzie tool-scons na dysk runnera
          pio platform install "https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip"

      - name: Inject Dummy Fortran Modules into SCons
        run: |
          # Rekurencyjnie przeszukuje cały folder .platformio w poszukiwaniu katalogów SCons i tworzy atrapy
          python3 -c "
          import os

          dummy_fortran_common = '''
          def DialectDirs(*args, **kwargs): return []
          def FortranEmitter(*args, **kwargs): return args[0] if args else None
          def ShFortranEmitter(*args, **kwargs): return args[0] if args else None
          '''

          dummy_fortran_scanner = '''
          def FortranScanType1(*args, **kwargs): return None
          def FortranScanType2(*args, **kwargs): return None
          '''

          patched_count = 0
          for root, dirs, files in os.walk('/home/runner/.platformio'):
              if root.endswith('SCons/Tool') or root.endswith('SCons/Tool/'):
                  target = os.path.join(root, 'FortranCommon.py')
                  print(f'Patching: {target}')
                  with open(target, 'w') as f:
                      f.write(dummy_fortran_common)
                  patched_count += 1
              if root.endswith('SCons/Scanner') or root.endswith('SCons/Scanner/'):
                  target = os.path.join(root, 'Fortran.py')
                  print(f'Patching: {target}')
                  with open(target, 'w') as f:
                      f.write(dummy_fortran_scanner)
                  patched_count += 1

          print(f'Done! Patched {patched_count} SCons directories.')
          "

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean

      - name: Create firmware archive
        run: |
          cd firmware/.pio/build/${{ inputs.variant }}
          tar -cJf ${{ env.FIRMWARE_ARCHIVE }} --ignore-failed-read *.bin *.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_ARCHIVE }}
          path: firmware/.pio/build/${{ inputs.variant }}/${{ env.FIRMWARE_ARCHIVE }}
          if-no-files-found: error
