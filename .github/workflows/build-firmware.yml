name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., xiaowa-esp32s3)"
        required: true
        type: string
        default: "xiaowa-esp32s3"
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Modify MQTT.cpp line (optional)
        if: inputs.modify_mqtt_line == true
        working-directory: firmware
        run: |
          sed -i 's#bool dontUplink = !mp_decoded.decoded.has_bitfield || !(mp_decoded.decoded.bitfield & BITFIELD_OK_TO_MQTT_MASK);#bool dontUplink = false;#' src/mqtt/MQTT.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Start SCons Watchdog (Background Patching)
        run: |
          echo "Uruchamianie patchera w tle..."
          (
          while true; do
            # Przeszukaj katalog domowy w poszukiwaniu nowo powstałych folderów SCons/Tool
            find /home/runner -type d -path "*/SCons/Tool" 2>/dev/null | while read -r dir; do
              if [ ! -f "$dir/FortranCommon.py" ]; then
                echo "Watchdog: Wykryto SCons! Wstrzykiwanie FortranCommon.py do $dir"
                echo -e "def DialectDirs(*args,**kwargs): return []\ndef FortranEmitter(*args,**kwargs): return args[0] if args else None\ndef ShFortranEmitter(*args,**kwargs): return args[0] if args else None" > "$dir/FortranCommon.py"
              fi
            done
            
            # Przeszukaj w poszukiwaniu SCons/Scanner
            find /home/runner -type d -path "*/SCons/Scanner" 2>/dev/null | while read -r dir; do
              if [ ! -f "$dir/Fortran.py" ]; then
                echo "Watchdog: Wykryto SCons Scanner! Wstrzykiwanie Fortran.py do $dir"
                echo -e "def FortranScanType1(*args,**kwargs): return None\ndef FortranScanType2(*args,**kwargs): return None" > "$dir/Fortran.py"
              fi
            done
            sleep 1
          done
          ) &
          echo "WATCHDOG_PID=$!" >> $GITHUB_ENV

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean

      - name: Stop SCons Watchdog
        if: always()
        run: |
          if [ -n "$WATCHDOG_PID" ]; then
            echo "Zatrzymywanie patchera (PID: $WATCHDOG_PID)..."
            kill $WATCHDOG_PID || true
          fi

      - name: Create firmware archive
        run: |
          cd firmware/.pio/build/${{ inputs.variant }}
          tar -cJf ${{ env.FIRMWARE_ARCHIVE }} --ignore-failed-read *.bin *.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_ARCHIVE }}
          path: firmware/.pio/build/${{ inputs.variant }}/${{ env.FIRMWARE_ARCHIVE }}
          if-no-files-found: error
