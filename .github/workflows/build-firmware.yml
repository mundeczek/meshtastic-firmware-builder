name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., cutretech-esp32s3)"
        required: true
        type: string
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Modify MQTT.cpp line (optional)
        if: inputs.modify_mqtt_line == true
        working-directory: firmware
        run: |
          sed -i 's#bool dontUplink = !mp_decoded.decoded.has_bitfield || !(mp_decoded.decoded.bitfield & BITFIELD_OK_TO_MQTT_MASK);#bool dontUplink = false;#' src/mqtt/MQTT.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Initial Build (Fetch tools and compile sources)
        working-directory: firmware
        run: |
          # Pierwszy przebieg dociąga pioarduino i narzędzia, ignorujemy błąd linkera na końcu
          pio run -e ${{ inputs.variant }} --disable-auto-clean || true

      - name: Auto-Patch SCons Fortran Modules
        run: |
          python3 -c "
          import os, urllib.request

          def patch_files(url, filename, folder_suffix):
              try:
                  content = urllib.request.urlopen(url).read()
                  for root, dirs, files in os.walk('/home/runner'):
                      if root.endswith(folder_suffix) or root.endswith(folder_suffix + '/'):
                          target = os.path.join(root, filename)
                          print(f'Patching: {target}')
                          with open(target, 'wb') as f:
                              f.write(content)
              except Exception as e:
                  print(f'Error patching {filename}: {e}')

          patch_files(
              'https://raw.githubusercontent.com/SCons/scons/4.7.0/SCons/Tool/FortranCommon.py',
              'FortranCommon.py',
              'SCons/Tool'
          )
          patch_files(
              'https://raw.githubusercontent.com/SCons/scons/4.7.0/SCons/Scanner/Fortran.py',
              'Fortran.py',
              'SCons/Scanner'
          )
          "

      - name: Finalize Build (Link ELF and generate BIN)
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean

      - name: Create firmware archive
        run: |
          cd firmware/.pio/build/${{ inputs.variant }}
          tar -cJf ${{ env.FIRMWARE_ARCHIVE }} --ignore-failed-read *.bin *.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_ARCHIVE }}
          path: firmware/.pio/build/${{ inputs.variant }}/${{ env.FIRMWARE_ARCHIVE }}
          if-no-files-found: error
