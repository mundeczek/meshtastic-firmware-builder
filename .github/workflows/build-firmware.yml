name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., xiaowa-esp32s3)"
        required: true
        type: string
        default: "xiaowa-esp32s3"
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Modify MQTT.cpp line (optional)
        if: inputs.modify_mqtt_line == true
        working-directory: firmware
        run: |
          sed -i 's#bool dontUplink = !mp_decoded.decoded.has_bitfield || !(mp_decoded.decoded.bitfield & BITFIELD_OK_TO_MQTT_MASK);#bool dontUplink = false;#' src/mqtt/MQTT.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Bootstrap PlatformIO Virtualenv
        run: |
          # Wymuszamy na PlatformIO utworzenie katalogu 'penv' i zainstalowanie podstawowych pakietów
          pio system info

      - name: Inject Meta-Path SCons Mock Hook
        run: |
          # Ten skrypt znajduje WSZYSTKIE foldery site-packages wewnątrz .platformio (główne penv i idf penv)
          # i umieszcza w nich sitecustomize.py, który w locie przechwytuje importy Fortrana z archiwów ZIP.
          python3 -c "
          import os

          hook_code = '''import sys, types
          from importlib.abc import MetaPathFinder, Loader
          from importlib.machinery import ModuleSpec

          class FortranMock(types.ModuleType):
              def __getattr__(self, name):
                  def dummy(*args, **kwargs):
                      if args: return args[0]
                      return []
                  return dummy

          class FortranMockFinder(MetaPathFinder):
              def find_spec(self, fullname, path, target=None):
                  if 'Fortran' in fullname or fullname == 'SCons.Tool.fortran':
                      return ModuleSpec(fullname, FortranMockLoader(fullname))
                  return None

          class FortranMockLoader(Loader):
              def __init__(self, fullname):
                  self.fullname = fullname
              def create_module(self, spec):
                  return FortranMock(self.fullname)
              def exec_module(self, module):
                  pass

          sys.meta_path.insert(0, FortranMockFinder())
          print('SCons Fortran Import Interceptor Active!')
          '''

          patched = 0
          for root, dirs, files in os.walk('/home/runner/.platformio'):
              if root.endswith('site-packages') or root.endswith('site-packages/'):
                  target = os.path.join(root, 'sitecustomize.py')
                  print(f'Injecting hook to: {target}')
                  with open(target, 'w') as f:
                      f.write(hook_code)
                  patched += 1
          print(f'Done! Injected hook to {patched} python environments.')
          "

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean

      - name: Create firmware archive
        run: |
          cd firmware/.pio/build/${{ inputs.variant }}
          tar -cJf ${{ env.FIRMWARE_ARCHIVE }} --ignore-failed-read *.bin *.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_ARCHIVE }}
          path: firmware/.pio/build/${{ inputs.variant }}/${{ env.FIRMWARE_ARCHIVE }}
          if-no-files-found: error
