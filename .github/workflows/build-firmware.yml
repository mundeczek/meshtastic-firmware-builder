name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., xiaowa-esp32s3)"
        required: true
        type: string
        default: "xiaowa-esp32s3"
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Modify MQTT.cpp line (optional)
        if: inputs.modify_mqtt_line == true
        working-directory: firmware
        run: |
          sed -i 's#bool dontUplink = !mp_decoded.decoded.has_bitfield || !(mp_decoded.decoded.bitfield & BITFIELD_OK_TO_MQTT_MASK);#bool dontUplink = false;#' src/mqtt/MQTT.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Force PlatformIO to Download SCons and Tools
        working-directory: firmware
        run: |
          # Uruchomienie celu 'clean' zmusza PlatformIO do pobrania i rozpakowania 
          # platformy pioarduino, kompilatorów oraz SCons, ale nie uruchamia samej kompilacji.
          pio run -e ${{ inputs.variant }} -t clean

      - name: Patch SCons (Fix Fortran Bug on disk)
        run: |
          # Skanujemy cały katalog .platformio i wstrzykujemy poprawki bezpośrednio do pobranych plików
          python3 -c "
          import os
          dummy_common = 'def DialectDirs(*args,**kwargs): return []\ndef FortranEmitter(*args,**kwargs): return args[0] if args else None\ndef ShFortranEmitter(*args,**kwargs): return args[0] if args else None\n'
          dummy_scanner = 'def FortranScanType1(*args,**kwargs): return None\ndef FortranScanType2(*args,**kwargs): return None\n'

          print('Przeszukiwanie pobranych pakietów SCons...')
          patched = 0
          for root, dirs, files in os.walk('/home/runner/.platformio'):
              if root.endswith('SCons/Tool') or root.endswith('SCons/Tool/'):
                  target = os.path.join(root, 'FortranCommon.py')
                  with open(target, 'w') as f:
                      f.write(dummy_common)
                  print(f'-> Załatano narzędzia: {target}')
                  patched += 1
              if root.endswith('SCons/Scanner') or root.endswith('SCons/Scanner/'):
                  target = os.path.join(root, 'Fortran.py')
                  with open(target, 'w') as f:
                      f.write(dummy_scanner)
                  print(f'-> Załatano skaner: {target}')
                  patched += 1
          print(f'Sukces! Załatano łącznie {patched} lokalizacji SCons.')
          "

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean

      - name: Create firmware archive
        run: |
          cd firmware/.pio/build/${{ inputs.variant }}
          tar -cJf ${{ env.FIRMWARE_ARCHIVE }} --ignore-failed-read *.bin *.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_ARCHIVE }}
          path: firmware/.pio/build/${{ inputs.variant }}/${{ env.FIRMWARE_ARCHIVE }}
          if-no-files-found: error
