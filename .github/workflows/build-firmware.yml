name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_branch:
        description: "Branch or tag to checkout from meshtastic/firmware"
        required: true
        type: string
        default: "develop"
      variant:
        description: "Variant to build (e.g., xiaowa-esp32s3)"
        required: true
        type: string
        default: "xiaowa-esp32s3"
      modify_mqtt_line:
        description: "mqqt me bro"
        required: true
        type: boolean
        default: false

run-name: Build ${{ inputs.variant }}-${{ inputs.firmware_branch }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRMWARE_ARCHIVE: firmware-${{ inputs.variant }}-${{ inputs.firmware_branch }}.tar.xz

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_branch }}
          path: firmware
          submodules: recursive

      - name: Copy variants folder
        run: cp -r builder/variants/* firmware/variants/

      - name: Copy boards folder
        run: cp -r builder/boards/* firmware/boards/

      - name: Modify MQTT.cpp line (optional)
        if: inputs.modify_mqtt_line == true
        working-directory: firmware
        run: |
          sed -i 's#bool dontUplink = !mp_decoded.decoded.has_bitfield || !(mp_decoded.decoded.bitfield & BITFIELD_OK_TO_MQTT_MASK);#bool dontUplink = false;#' src/mqtt/MQTT.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Download and Patch espressif32 Platform Config
        run: |
          # 1. Pobieramy platformę pioarduino używaną przez Meshtastic 2.8
          wget -q https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
          unzip -q 55.03.311.zip
          mv pioarduino-platform-espressif32-55.03.311 platform-espressif32
          
          # 2. Podmieniamy wymagany SCons na wersję 4.7.0 (4.40700.0) posiadającą FortranCommon
          sed -i 's/"tool-scons": "[^"]*"/"tool-scons": "~4.40700.0"/g' platform-espressif32/platform.json
          
          echo "Zweryfikowana wersja tool-scons w platform.json:"
          grep "tool-scons" platform-espressif32/platform.json

      - name: Redirect PlatformIO to patched local platform
        working-directory: firmware
        run: |
          # Podmieniamy link URL w platformio.ini na naszą lokalną, załataną platformę
          sed -i 's|platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip|platform = file://${{ github.workspace }}/platform-espressif32|g' platformio.ini
          
          echo "Zweryfikowana ścieżka platformy w platformio.ini:"
          grep "platform =" platformio.ini | head -n 5

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ inputs.variant }} --disable-auto-clean

      - name: Create firmware archive
        run: |
          cd firmware/.pio/build/${{ inputs.variant }}
          tar -cJf ${{ env.FIRMWARE_ARCHIVE }} --ignore-failed-read *.bin *.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_ARCHIVE }}
          path: firmware/.pio/build/${{ inputs.variant }}/${{ env.FIRMWARE_ARCHIVE }}
          if-no-files-found: error
